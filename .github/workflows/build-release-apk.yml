name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

concurrency:
  group: build-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm and build Web UI
        run: |
          npm install -g pnpm
          cd web-ui
          pnpm install --frozen-lockfile || pnpm install
          pnpm run build

      - name: Restore google-services.json if provided
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json restored from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON secret is not set. Continue without it."
          fi

      - name: Prepare signing files
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew --no-daemon assembleRelease --stacktrace --info

      - name: List APK outputs
        if: success()
        run: |
          find app/build/outputs/apk -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Extract version
        if: success()
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "v1.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}-$(date +%Y%m%d%H%M%S)" \
            --title "Release ${{ steps.version.outputs.version }}" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-build-reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
